# ---- Observabilidad: métricas Prometheus en la Admin API (:8001/metrics) ----
plugins:
  - name: prometheus
    config:
      per_consumer: true
      status_code_metrics: true
      latency_metrics: true
      bandwidth_metrics: true
      ai_metrics: true      # tokens/coste/latencia del proveedor LLM (Kong >= 3.8)

services:
  # ===== 1) AI Gateway: ai-proxy (OSS) =====
  # Un único service con 3 rutas, una por proveedor. Las políticas comunes (auth, rate limit,
  # trazabilidad, system prompt y guard) van a nivel de service y aplican a las tres rutas;
  # ai-proxy va por ruta porque es lo que cambia (proveedor, modelo y credencial).
  #
  #   /ai/chat            → mock-llm local (por defecto, sin API key)
  #   /ai/openai/chat     → OpenAI      (requiere OPENAI_API_KEY)
  #   /ai/anthropic/chat  → Anthropic   (requiere ANTHROPIC_API_KEY)
  #
  # El cliente SIEMPRE usa el formato OpenAI (messages/choices); ai-proxy lo traduce al de cada
  # proveedor. Las claves se leen del entorno de Kong con el vault `env` (ver .env.example).
  - name: ai-llm
    url: http://mock-llm:8000   # placeholder: ai-proxy lo sustituye por el destino del proveedor
    routes:
      - name: ai-chat
        paths: [/ai/chat]
        strip_path: true
        plugins:
          - name: ai-proxy
            config:
              route_type: llm/v1/chat
              logging: { log_statistics: true, log_payloads: false }  # métricas kong_ai_*
              auth:
                header_name: Authorization
                header_value: Bearer mock-key
              model:
                provider: openai
                name: gpt-4o-mini
                options:
                  upstream_url: http://mock-llm:8000/v1/chat/completions

      # Rutas reales: SIN options.upstream_url a propósito (ai-proxy llama al proveedor, no al mock del service).
      # No añadas upstream_url aquí o las claves reales irían al mock.
      - name: ai-chat-openai
        paths: [/ai/openai/chat]
        strip_path: true
        plugins:
          - name: ai-proxy
            config:
              route_type: llm/v1/chat
              logging: { log_statistics: true, log_payloads: false }
              auth:
                header_name: Authorization
                header_value: "{vault://env/openai-auth-header}"   # env OPENAI_AUTH_HEADER = "Bearer $OPENAI_API_KEY"
              model:
                provider: openai
                name: gpt-4o-mini        # cambia aquí el modelo
                options:
                  max_tokens: 512
                  temperature: 0.7

      - name: ai-chat-anthropic
        paths: [/ai/anthropic/chat]
        strip_path: true
        plugins:
          - name: ai-proxy
            config:
              route_type: llm/v1/chat
              logging: { log_statistics: true, log_payloads: false }
              auth:
                header_name: x-api-key
                header_value: "{vault://env/anthropic-api-key}"    # env ANTHROPIC_API_KEY
              model:
                provider: anthropic
                name: claude-sonnet-5-5  # cambia aquí el modelo
                options:
                  anthropic_version: "2023-06-01"
                  max_tokens: 512
                  temperature: 0.7
    plugins:
      - name: jwt               # OAuth2 (client_credentials) delegado en Keycloak; alternativa a apikey
        config:
          key_claim_name: azp
          claims_to_verify: [exp]
          anonymous: anonymous
      - name: key-auth
        config: { anonymous: anonymous }
      - name: pre-function      # corte temprano: sin apikey ni Authorization → 401 antes de cualquier otro plugin
        config:
          access:
            - |
              if not kong.request.get_header("apikey") and not kong.request.get_header("authorization") then
                return kong.response.exit(401, { message = "Unauthorized: se requiere apikey o Bearer token" }, { ["WWW-Authenticate"] = "Bearer" })
              end
      - name: post-function     # sin apikey ni Bearer válido → consumidor "anonymous" → 401 (jwt y key-auth se complementan con "anonymous")
        config:
          access:
            - |
              local c = kong.client.get_consumer()
              if not c or c.username == "anonymous" then
                return kong.response.exit(401, { message = "Unauthorized: se requiere apikey o Bearer token" }, { ["WWW-Authenticate"] = "Bearer" })
              end
      - name: rate-limiting      # límite por consumidor (compartido entre las 3 rutas = presupuesto de IA)
        config: { minute: 10, policy: local, limit_by: consumer }
      - name: correlation-id
        config: { header_name: X-Request-Id, generator: uuid, echo_downstream: true }
      - name: request-transformer   # el proveedor no debe comprimir con br: ai-proxy no decodifica brotli y corta la conexión
        config:
          remove:
            headers: [Accept-Encoding]
      - name: ai-prompt-decorator   # inyecta un system prompt corporativo
        config:
          prompts:
            prepend:
              - { role: system, content: "Responde siempre en español y de forma breve." }
      - name: ai-prompt-guard       # bloquea prompts con patrones prohibidos
        config:
          allow_all_conversation_history: true
          deny_patterns: [".*password.*", ".*ignore previous instructions.*"]

  # ===== 2) MCP Gateway: proxy + políticas sobre MCP (Streamable HTTP) =====
  - name: mcp-backend
    url: http://mcp-server:8000
    routes:
      - name: mcp
        paths: [/mcp]
        strip_path: true
    plugins:
      - name: jwt               # OAuth2 (client_credentials) delegado en Keycloak; alternativa a apikey
        config:
          key_claim_name: azp
          claims_to_verify: [exp]
          anonymous: anonymous
      - name: key-auth
        config: { anonymous: anonymous }
      - name: pre-function      # corte temprano: sin apikey ni Authorization → 401 antes de cualquier otro plugin
        config:
          access:
            - |
              if not kong.request.get_header("apikey") and not kong.request.get_header("authorization") then
                return kong.response.exit(401, { message = "Unauthorized: se requiere apikey o Bearer token" }, { ["WWW-Authenticate"] = "Bearer" })
              end
      - name: post-function     # sin apikey ni Bearer válido → consumidor "anonymous" → 401 (jwt y key-auth se complementan con "anonymous")
        config:
          access:
            - |
              local c = kong.client.get_consumer()
              if not c or c.username == "anonymous" then
                return kong.response.exit(401, { message = "Unauthorized: se requiere apikey o Bearer token" }, { ["WWW-Authenticate"] = "Bearer" })
              end
      - name: rate-limiting
        config: { minute: 30, policy: local, limit_by: consumer }
      - name: request-size-limiting
        config: { allowed_payload_size: 1 }   # MB
      - name: correlation-id
        config: { header_name: X-Request-Id, generator: uuid, echo_downstream: true }

  # ===== 3) A2A Gateway: proxy + políticas sobre agentes A2A =====
  - name: a2a-backend
    url: http://a2a-agent:8000
    routes:
      - name: a2a
        paths: [/a2a]
        strip_path: true
    plugins:
      - name: jwt               # OAuth2 (client_credentials) delegado en Keycloak; alternativa a apikey
        config:
          key_claim_name: azp
          claims_to_verify: [exp]
          anonymous: anonymous
      - name: key-auth
        config: { anonymous: anonymous }
      - name: pre-function      # corte temprano: sin apikey ni Authorization → 401 antes de cualquier otro plugin
        config:
          access:
            - |
              if not kong.request.get_header("apikey") and not kong.request.get_header("authorization") then
                return kong.response.exit(401, { message = "Unauthorized: se requiere apikey o Bearer token" }, { ["WWW-Authenticate"] = "Bearer" })
              end
      - name: post-function     # sin apikey ni Bearer válido → consumidor "anonymous" → 401 (jwt y key-auth se complementan con "anonymous")
        config:
          access:
            - |
              local c = kong.client.get_consumer()
              if not c or c.username == "anonymous" then
                return kong.response.exit(401, { message = "Unauthorized: se requiere apikey o Bearer token" }, { ["WWW-Authenticate"] = "Bearer" })
              end
      - name: rate-limiting
        config: { minute: 30, policy: local, limit_by: consumer }
      - name: correlation-id
        config: { header_name: X-Request-Id, generator: uuid, echo_downstream: true }

  # ===== OIDC: duplicado de los tres gateways, accesible SOLO con login de usuario (Keycloak) =====
  # Mismos backends y políticas (rate limit propio, trazabilidad, prompt decorator/guard, ai-proxy), pero la
  # autenticación es OpenID Connect: Keycloak hace el login (Google / GitHub / LinkedIn por identity brokering) y
  # Kong valida el JWT con `jwt` + `acl`. NO acepta apikey ni tokens client_credentials. (El plugin
  # openid-connect de Kong es de pago; por eso el login lo hace Keycloak.)

  - name: ai-llm-oidc
    url: http://mock-llm:8000   # placeholder: ai-proxy lo sustituye por el destino del proveedor
    routes:
      - name: oidc-ai-chat
        paths: [/oidc/ai/chat]
        strip_path: true
        plugins:
          - name: ai-proxy
            config:
              route_type: llm/v1/chat
              logging: { log_statistics: true, log_payloads: false }  # métricas kong_ai_*
              auth:
                header_name: Authorization
                header_value: Bearer mock-key
              model:
                provider: openai
                name: gpt-4o-mini
                options:
                  upstream_url: http://mock-llm:8000/v1/chat/completions

      # Rutas reales: SIN options.upstream_url a propósito (ai-proxy llama al proveedor, no al mock del service).
      # No añadas upstream_url aquí o las claves reales irían al mock.
      - name: oidc-ai-chat-openai
        paths: [/oidc/ai/openai/chat]
        strip_path: true
        plugins:
          - name: ai-proxy
            config:
              route_type: llm/v1/chat
              logging: { log_statistics: true, log_payloads: false }
              auth:
                header_name: Authorization
                header_value: "{vault://env/openai-auth-header}"   # env OPENAI_AUTH_HEADER = "Bearer $OPENAI_API_KEY"
              model:
                provider: openai
                name: gpt-4o-mini        # cambia aquí el modelo
                options:
                  max_tokens: 512
                  temperature: 0.7

      - name: oidc-ai-chat-anthropic
        paths: [/oidc/ai/anthropic/chat]
        strip_path: true
        plugins:
          - name: ai-proxy
            config:
              route_type: llm/v1/chat
              logging: { log_statistics: true, log_payloads: false }
              auth:
                header_name: x-api-key
                header_value: "{vault://env/anthropic-api-key}"    # env ANTHROPIC_API_KEY
              model:
                provider: anthropic
                name: claude-sonnet-5-5  # cambia aquí el modelo
                options:
                  anthropic_version: "2023-06-01"
                  max_tokens: 512
                  temperature: 0.7
    plugins:
      - name: jwt               # OIDC: solo Bearer emitido por Keycloak tras un login de usuario (sin anonymous ni apikey)
        config:
          key_claim_name: azp
          claims_to_verify: [exp]
      - name: acl               # solo clientes de login de usuario (grupo oidc-users); client_credentials → 403
        config: { allow: [oidc-users] }
      - name: post-function     # descubrimiento MCP (RFC 9728): dónde está el servidor de autorización
        config:
          header_filter:
            - |
              if kong.response.get_status() == 401 then
                kong.response.set_header("WWW-Authenticate", 'Bearer resource_metadata="http://localhost:8000/.well-known/oauth-protected-resource/oidc/ai"')
              end
      - name: rate-limiting      # límite por consumidor (compartido entre las 3 rutas = presupuesto de IA)
        config: { minute: 10, policy: local, limit_by: consumer }
      - name: correlation-id
        config: { header_name: X-Request-Id, generator: uuid, echo_downstream: true }
      - name: request-transformer   # el proveedor no debe comprimir con br: ai-proxy no decodifica brotli y corta la conexión
        config:
          remove:
            headers: [Accept-Encoding]
      - name: ai-prompt-decorator   # inyecta un system prompt corporativo
        config:
          prompts:
            prepend:
              - { role: system, content: "Responde siempre en español y de forma breve." }
      - name: ai-prompt-guard       # bloquea prompts con patrones prohibidos
        config:
          allow_all_conversation_history: true
          deny_patterns: [".*password.*", ".*ignore previous instructions.*"]


  - name: mcp-backend-oidc
    url: http://mcp-server:8000
    routes:
      - name: oidc-mcp
        paths: [/oidc/mcp]
        strip_path: true
    plugins:
      - name: jwt               # OIDC: solo Bearer emitido por Keycloak tras un login de usuario (sin anonymous ni apikey)
        config:
          key_claim_name: azp
          claims_to_verify: [exp]
      - name: acl               # solo clientes de login de usuario (grupo oidc-users); client_credentials → 403
        config: { allow: [oidc-users] }
      - name: post-function     # descubrimiento MCP (RFC 9728): dónde está el servidor de autorización
        config:
          header_filter:
            - |
              if kong.response.get_status() == 401 then
                kong.response.set_header("WWW-Authenticate", 'Bearer resource_metadata="http://localhost:8000/.well-known/oauth-protected-resource/oidc/mcp"')
              end
      - name: rate-limiting
        config: { minute: 30, policy: local, limit_by: consumer }
      - name: request-size-limiting
        config: { allowed_payload_size: 1 }   # MB
      - name: correlation-id
        config: { header_name: X-Request-Id, generator: uuid, echo_downstream: true }


  - name: a2a-backend-oidc
    url: http://a2a-agent:8000
    routes:
      - name: oidc-a2a
        paths: [/oidc/a2a]
        strip_path: true
    plugins:
      - name: jwt               # OIDC: solo Bearer emitido por Keycloak tras un login de usuario (sin anonymous ni apikey)
        config:
          key_claim_name: azp
          claims_to_verify: [exp]
      - name: acl               # solo clientes de login de usuario (grupo oidc-users); client_credentials → 403
        config: { allow: [oidc-users] }
      - name: post-function     # descubrimiento MCP (RFC 9728): dónde está el servidor de autorización
        config:
          header_filter:
            - |
              if kong.response.get_status() == 401 then
                kong.response.set_header("WWW-Authenticate", 'Bearer resource_metadata="http://localhost:8000/.well-known/oauth-protected-resource/oidc/a2a"')
              end
      - name: rate-limiting
        config: { minute: 30, policy: local, limit_by: consumer }
      - name: correlation-id
        config: { header_name: X-Request-Id, generator: uuid, echo_downstream: true }


  # Metadatos del recurso protegido (RFC 9728): público, sin autenticación.
  - name: oidc-metadata
    url: http://mcp-server:8000
    routes:
      - name: oidc-metadata
        paths: [/.well-known/oauth-protected-resource/oidc]
        strip_path: false
    plugins:
      - name: request-termination
        config:
          status_code: 200
          content_type: application/json
          body: '{"resource":"http://localhost:8000/oidc","authorization_servers":["http://localhost:8180/realms/kong-demo"],"bearer_methods_supported":["header"]}'
