# Overlay de observabilidad. Uso (desde la raíz del repo):
#   docker compose -f docker-compose.yml -f observability/docker-compose.yml up -d --build
services:
  prometheus:
    image: prom/prometheus:v2.55.1
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["9090:9090"]
    depends_on: [kong]

  grafana:
    image: grafana/grafana-oss:11.3.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"        # solo demo
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/kong-ai-gov.json
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["${GRAFANA_PORT:-3001}:3000"]   # 3001 para no chocar con otros servicios en :3000
    depends_on: [prometheus]

  traffic:
    build: ./observability/traffic
    environment:
      GATEWAY: http://kong:8000
      KEY_ALICE: alice-key
      KEY_BOB: bob-key
      AUTOSTART: "true"     # genera tráfico de fondo para que el dashboard no salga vacío
    ports: ["8090:8090"]
    depends_on: [kong]
